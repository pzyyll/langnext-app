[package]
name = "langnext-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
keywords = ["nshm"]

[dependencies]
log = "0.4"
nsh-core = "=0.7.0"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
fastembed = { version = "7.8.0", default-features = false, features = [
  "ort-download-binaries-native-tls",
  "fancy-regex",
] }
serde_json = "1"
sha2 = "0.10.9"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
png = "0.18"
