# ABOUTME: Project toolchain versions managed by mise
# ABOUTME: Run `mise install` after clone to install node, bun, and rust

[tools]
node = "22"
bun = "1.3"
rust = "stable"

[tasks.install]
description = "Install JS dependencies with bun"
run = "bun install"

[tasks.dev]
description = "Start Vite frontend dev server"
run = "bun run dev"

[tasks.build]
description = "Typecheck and build the frontend"
run = "bun run build"

[tasks.lint]
description = "Run ESLint"
run = "bun run lint"

[tasks.format]
description = "Format sources with Prettier"
run = "bun run format"

[tasks."tauri:dev"]
description = "Run the full Tauri desktop app"
run = "bun run tauri dev"

[tasks."tauri:build"]
description = "Package the desktop app"
run = "bun run tauri build"
