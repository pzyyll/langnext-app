# ABOUTME: Project toolchain versions managed by mise
# ABOUTME: Project tasks live in `.mise/tasks/` as file tasks

[tools]
node = "26.3.0"
bun = "1.3"
# Host and guest Rust toolchain, pinned to an exact verifiable version (Issue 9). The conformance
# guest build (cargo component) and the Tauri host build both use this toolchain. The
# wasm32-unknown-unknown target is required by the no-std conformance guest components
# (cargo-component otherwise only auto-installs wasm32-wasip1).
rust = { version = "1.96.1", targets = ["wasm32-unknown-unknown"] }
# cargo-component subcommand, pinned via the mise `cargo:` backend so the guest component build
# uses a verifiable version instead of a machine-global install.
"cargo:cargo-component" = "0.21.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
