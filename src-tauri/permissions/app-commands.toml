# ABOUTME: Explicit app-local command permission set for trusted application WebViews.
# ABOUTME: Each `allow-<command>` is autogenerated by tauri-build from `build.rs` APP_COMMANDS
# into `permissions/autogenerated/`. This set groups them so the `trusted-app` capability
# grants the reviewed command surface explicitly. Do NOT add a `[default]` set here: app
# commands must never be auto-granted, only assigned through an explicit capability.

[[set]]
identifier = "allow-trusted-app-commands"
description = "Grants every reviewed app-local IPC command to the trusted application WebViews (main, quick-translate, screenshot-overlay). Adding a command requires listing it in build.rs APP_COMMANDS and here, otherwise the security-conformance test fails and the command is denied at runtime. Phase 9 adds a narrower plugin-page subset separately."
permissions = [
  "allow-show-snap-overlay",
  "allow-set-pin",
  "allow-resize-window-height",
  "allow-notify-ready",
  "allow-region-screenshot-get-backdrop",
  "allow-region-screenshot-get-backdrop-data",
  "allow-region-screenshot-reveal",
  "allow-region-screenshot-confirm",
  "allow-region-screenshot-cancel",
  "allow-start-region-screenshot",
  "allow-list-provider-instances",
  "allow-save-provider-instance",
  "allow-set-provider-enabled",
  "allow-delete-provider-instance",
  "allow-reorder-provider-instances",
  "allow-list-provider-models",
  "allow-list-all-provider-models",
  "allow-save-manual-model",
  "allow-set-model-enabled",
  "allow-set-model-adapter-id",
  "allow-update-model-config",
  "allow-delete-provider-model",
  "allow-delete-provider-models",
  "allow-apply-provider-model-sync",
  "allow-apply-provider-model-sync-failure",
  "allow-provider-http-request",
