[package]
name = "langnext-app"
version = "0.1.0"
description = "LangNext desktop application"
authors = ["pzyyll"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "langnext_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
keyring = "4.1.4"
uuid = { version = "1.23.4", features = ["v7", "serde"] }
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "serde-well-known"] }
thiserror = "2.0.18"
url = "2"
tempfile = "3.27.0"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

# Win+Z snap overlay for custom maximize hover (Windows only).
[target.'cfg(windows)'.dependencies]
enigo = "0.1.3"
