[package]
name = "langnext-app"
version = "0.1.0"
description = "LangNext desktop application"
authors = ["pzyyll"]
edition = "2024"
license = "Apache-2.0"
default-run = "langnext-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "langnext_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "plugin_tool"
path = "src/bin/plugin_tool.rs"
# Offline package finalize/verify helper; not the Tauri desktop entrypoint.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# WIT text parsing for runtime-plugin capability world conformance tests (Phase 0 contracts).
# Text-only: no wasm decoding/wat features pulled in.
wit-parser = { version = "0.244", default-features = false }
# WAT parser for synthesizing adversarial Component fixtures (undeclared/unlinked imports) in
# Phase 2 runtime tests. Not used in production builds.
wat = "1.254"
# tokio test-util enables `start_paused`/`time::pause` for deterministic stream pump idle/deadline
# tests without real multi-second waits. Only enabled for test builds.
tokio = { version = "1", features = ["test-util", "rt", "rt-multi-thread", "macros", "time"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
keyring = "4.1.4"
uuid = { version = "1.23.4", features = ["v7", "serde"] }
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "serde-well-known"] }
thiserror = "2.0.18"
url = "2"
semver = "1"
tempfile = "3.27.0"
reqwest = { version = "0.13", features = ["json", "form"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"
# Google service-account JWT assertions (RS256 + PEM). rust_crypto backend avoids native OpenSSL.
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Large secrets (e.g. Google service-account JSON) exceed Windows Credential Manager limits
# when stored via UTF-16 passwords; overflow files are AES-GCM sealed with a keyring master key.
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
# Phase 3: bounded ZIP archive read/write for signed `.lnplugin` packages.
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
# Phase 3: Ed25519 verification of exact plugin.json bytes (signing used in tests/tooling only).
ed25519-dalek = { version = "=3.0.0", default-features = true, features = ["rand_core"] }
rand = "0.8"
# Host target triple for compiled Component cache identity (Issue 6: complete arch-vendor-os-env
# triple, not the incomplete std::env::consts arch-os form). Pinned to the version wasmtime 47
# depends on so the host and wasmtime agree on the host triple.
target-lexicon = "0.13"
# Phase 2: Wasm Component runtime for external service plugins. Pinned to 47.0.2; minimal
# feature set excludes WASI, the Component async ABI, threads, and stack-switching. The host
# uses async embedding (Store/Linker `*_async`) plus LangNext StreamHandle semantics instead
# of `component-model-async`. See `src-tauri/src/services/wasm_runtime/` and
# docs/plans/runtime-plugin-system/phase-2-wasm-runtime.md.
wasmtime = { version = "=47.0.2", default-features = false, features = [
  "async",
  "cache",
  "component-model",
  "cranelift",
  "pooling-allocator",
  "runtime",
  "std",
] }

# Desktop-only: global hotkey, clipboard, and region screenshot capture.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
xcap = "0.9"
tauri-plugin-single-instance = "2.4.3"

# macOS/Linux image clipboard via arboard. Windows uses a native Win32 path in screenshot.rs
# (prepare buffers first, OpenClipboard with a real HWND) to avoid ERROR_CLIPBOARD_NOT_OPEN.
[target.'cfg(all(not(any(target_os = "android", target_os = "ios")), not(windows)))'.dependencies]
arboard = "3"

# Win+Z snap overlay for custom maximize hover (Windows only).
# kmhook: low-level keyboard hooks for double Ctrl+C (Windows only).
[target.'cfg(windows)'.dependencies]
enigo = "0.1.3"
kmhook = { git = "https://github.com/pzyyll/kmhook-rs.git", branch = "main" }
