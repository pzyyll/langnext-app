[package]
name = "langnext-openai-compatible-protocol"
version = "1.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
# Declared so the guest crates' `std_feature` wit-bindgen cfg checks are known; never enabled here.
std = []

[dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
