[package]
name = "langnext-conformance-ocr-trap"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
std = []

[dependencies]
wit-bindgen = { version = "=0.41.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.component]
package = "langnext:conformance-ocr-trap"

[package.metadata.component.target]
path = "../../../src-tauri/wit/runtime-plugin"
world = "ocr-image-world"

[package.metadata.component.dependencies]
