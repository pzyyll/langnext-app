[package]
name = "langnext-google-cloud-translate"
version = "1.2.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[features]
std = []

[dependencies]
wit-bindgen = { version = "=0.41.0", default-features = false, features = ["macros", "realloc"] }
langnext-google-cloud-protocol = { path = "../protocol" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.component]
package = "langnext:google-cloud-translate"

[package.metadata.component.target]
path = "../../../src-tauri/wit/runtime-plugin"
world = "translate-text-world"

[package.metadata.component.dependencies]
