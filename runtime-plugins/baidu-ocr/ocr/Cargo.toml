# ABOUTME: Baidu OCR no-WASI Component implementing the ocr.image@1 capability.
# ABOUTME: Uses host blobs and the approved broker; it has no ambient OS or network imports.
[package]
name = "langnext-baidu-ocr"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
std = []

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
langnext-baidu-ocr-protocol = { path = "../protocol", default-features = false }
wit-bindgen = { version = "=0.41.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.component]
package = "langnext:baidu-ocr"

[package.metadata.component.target]
path = "../../../src-tauri/wit/runtime-plugin"
world = "ocr-image-world"

[package.metadata.component.dependencies]
