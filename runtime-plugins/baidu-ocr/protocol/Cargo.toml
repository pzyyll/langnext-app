# ABOUTME: Baidu OCR wire protocol codec used by the Wasm guest and conformance tests.
# ABOUTME: Keeps request construction and response normalization independent from host secrets.
[package]
name = "langnext-baidu-ocr-protocol"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
