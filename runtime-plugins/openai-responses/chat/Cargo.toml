[package]
name = "langnext-openai-responses-chat-wasm"
version = "1.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[features]
# Declared so wit-bindgen `std_feature` cfg checks are known; never enable for the no_std guest.
std = []

[dependencies]
# Generated bindings are committed as `src/generated.rs` (wit-bindgen 0.41 codegen + one
# sanctioned fix for list<borrow<blob-handle>>); the runtime crate resolves the
# `wit_bindgen_rt::` paths in that file.
wit-bindgen-rt = { version = "=0.41.0", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
langnext-openai-responses-protocol = { path = "../protocol" }

[profile.release]
# Deterministic builds for the committed package fixture.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.component]
package = "langnext:openai-responses-chat"

[package.metadata.component.target]
path = "../../../src-tauri/wit/runtime-plugin"
world = "llm-chat-world"

[package.metadata.component.dependencies]
